<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deutsche Bahn</title>
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/4/4f/Deutsche_Bundesbahn.svg">
    <link rel="stylesheet" href="styles/index.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1YBCXTC22Y"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-1YBCXTC22Y');
    </script>
</head>
<body>

    <div class = "header">
        <div class = "header-db-logo-container hoverable-icon">
            <a href="https://bahn.de" target="_blank">
                <img class = "header-db-logo" src="https://upload.wikimedia.org/wikipedia/commons/4/4f/Deutsche_Bundesbahn.svg" alt="Logo">
            </a>
        </div>
        <div class = "header-name-of-application-container">
            <h1 class = "header-name-of-application">Passenger Information Display System</h1>
        </div>
        <div class = "leave-your-message-container hoverable-icon">
            <a href="feedback.html" target="_blank">
                <img class="leave-your-message-container-logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkzyylSlcbzWbCwFvqwX3Wk5gG3Rygnas75NTcTzJNjAqW6Nxw96VKWfyb&s=10" alt="DB Logo">
            </a>
        </div>
    </div>

    <div class="request-body">
        <div class="request-body-function-button hoverable-button" onclick="tabSelected(this, 'verbindungen')">
            <div class="request-body-function-button-text">Aktuelle Verbindungen</div>
        </div>
        <div class="request-body-function-button hoverable-button" onclick="tabSelected(this, 'aktualisieren')">
            <div class="request-body-function-button-text">Abfahrtszeiten aktualisieren</div>
        </div>


        <div id="connections-table-container" class="hidden" style="grid-column: 1 / -1; width: 100%;">
            <table class="departures-table">
                <thead>
                <tr>
                    <th>Zeit</th>
                    <th>Erwartete Abfahrtszeit</th>
                    <th>Zug</th>
                    <th>Ziel</th>
                    <th>Gleis</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>

        <div id="update-form-container" class="hidden" style="grid-column: 1 / -1; width: 100%; max-width: 400px; margin: 20px auto;">
            <form id="update-live-form" style="display: flex; flex-direction: column; gap: 12px;">
                <label style="font-family: sans-serif; font-weight: bold;">ID der Reise:</label>
                <input type="number" id="trip-id" required placeholder="zum Beispiel: 4" style="padding: 10px; border-radius: 8px; border: 1px solid #ccc;">

                <label style="font-family: sans-serif; font-weight: bold;">Aktuelle Abfahrtszeit (HH:MM):</label>
                <input type="text" id="actual-time" required placeholder="zum Beispiel: 12:52" style="padding: 10px; border-radius: 8px; border: 1px solid #ccc;">

                <button type="submit" class="hoverable-button" style="background-color: black; color: white; padding: 12px; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; text-transform: uppercase;">
                    Aktualisieren
                </button>
            </form>
            <div id="form-response-message" style="margin-top: 15px; text-align: center; font-family: sans-serif; font-weight: bold;"></div>
        </div>

    </div>












    <script src="scripts/index.js"></script>
</body>
</html>
