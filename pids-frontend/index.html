<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nicht Deutsche Bahn</title>
    <link rel="icon" type="image/png"
        href="https://upload.wikimedia.org/wikipedia/commons/4/4f/Deutsche_Bundesbahn.svg">
    <link rel="stylesheet" href="styles/index.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1YBCXTC22Y"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-1YBCXTC22Y');
    </script>
</head>

<body>

    <div class="header">
        <div class="header-db-logo-container hoverable-icon">
            <a href="https://bahn.de" target="_blank">
                <img class="header-db-logo"
                    src="https://upload.wikimedia.org/wikipedia/commons/4/4f/Deutsche_Bundesbahn.svg" alt="Logo">
            </a>
        </div>
        <div class="header-name-of-application-container">
            <a href="index.html" style="text-decoration: none" target="_blank">
                <h1 class="header-name-of-application">Passenger Information Display System</h1>
            </a>
        </div>
        <div class="leave-your-message-container hoverable-icon">
            <a href="feedback.html" target="_blank">
                <img class="leave-your-message-container-logo"
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkzyylSlcbzWbCwFvqwX3Wk5gG3Rygnas75NTcTzJNjAqW6Nxw96VKWfyb&s=10"
                    alt="DB Logo">
            </a>
        </div>
    </div>

    <div class="request-body">
        <button type="button" class="request-body-function-button hoverable-button active"
            aria-pressed="true" aria-controls="connections-table-container">
            <span class="button-text">Aktuelle Verbindungen</span>
        </button>
        <button type="button" class="request-body-function-button hoverable-button"
            aria-pressed="false" aria-controls="departure-management">
            <span class="button-text">Abfahrten verwalten</span>
        </button>

        <div id="connections-table-container" class="departure-panel">
            <form id="departure-filters" class="departure-filters">
                <label>Startbahnhof <input name="origin" maxlength="255"></label>
                <label>ID größer als <input name="idGreaterThan" type="number" min="0" step="1"></label>
                <button type="submit">Filtern</button>
            </form>
            <table class="departures-table">
                <thead>
                    <tr>
                        <th>Zeit</th>
                        <th>Erwartete Abfahrtszeit</th>
                        <th>Zug</th>
                        <th>Start</th>
                        <th>Ziel</th>
                        <th>Gleis</th>
                        <th>ID</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
            <div class="departure-pagination">
                <button type="button" id="previous-page" disabled>Zurück</button>
                <span id="departure-page"></span>
                <button type="button" id="next-page" disabled>Weiter</button>
            </div>
            <p id="board-message" role="status"></p>
        </div>

        <div id="departure-management" class="departure-panel departure-management hidden">
            <form id="create-departures">
                <h2>Abfahrten hinzufügen</h2>
                <div id="new-departure-rows"></div>
                <div class="departure-form-actions">
                    <button type="button" id="add-departure-row">Weitere Abfahrt</button>
                    <button type="submit">Speichern</button>
                </div>
                <p role="status"></p>
            </form>
            <div class="departure-actions">
                <form id="update-live-form">
                    <h2>Live-Zeit aktualisieren</h2>
                    <label>ID <input name="id" type="number" min="1" step="1"></label>
                    <label>Startbahnhof <input name="origin" maxlength="255"></label>
                    <small>Gib eine ID oder einen Startbahnhof ein.</small>
                    <label>Erwartete Abfahrtszeit <input name="actualTime" type="time" required></label>
                    <button type="submit">Aktualisieren</button>
                    <p role="status"></p>
                </form>
                <form id="delete-departures">
                    <h2>Abfahrten löschen</h2>
                    <label>Auswahl
                        <select name="mode">
                            <option value="single">Genau diese ID</option>
                            <option value="after">Alle IDs größer als</option>
                        </select>
                    </label>
                    <label>ID <input name="id" type="number" min="1" step="1" required></label>
                    <button type="submit">Löschen</button>
                    <p role="status"></p>
                </form>
            </div>
        </div>
        <template id="new-departure-template">
            <fieldset class="new-departure">
                <label>Startbahnhof <input name="origin" maxlength="255"></label>
                <label>Ziel <input name="destination" maxlength="255"></label>
                <label>Gleis <input name="platform" placeholder="z. B. Gleis 2" maxlength="255"></label>
                <label>Zug <input name="trainLine" maxlength="255"></label>
                <label>Planzeit <input name="scheduledTime" type="time" required></label>
                <button type="button" class="remove-departure-row">Zeile entfernen</button>
            </fieldset>
        </template>

    </div>

    <div class = "tail-body">
        <a class = "faq-button-link faq-button hoverable-button" data-action="faq" style="text-decoration: none" href="faq.html" target="_blank">
            <div class="button-text" style="font-size: 18px; text-transform: none; font-weight: normal;">drucke den Knopf um mehr zu erfahren</div>
        </a>
    </div>













    <script type="module" src="scripts/index.js"></script>
</body>

</html>
