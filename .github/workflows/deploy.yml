name: Deploy Backend to GCP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      - name: Copy JAR to GCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "~/app/"
          strip_components: 2

      - name: Clean Old Files and Restart Application on GCP
        uses: appleboy/ssh-action@v1.0.3
        with:
            host: ${{ secrets.SERVER_HOST }}
            username: ${{ secrets.SERVER_USER }}
            key: ${{ secrets.SERVER_SSH_KEY }}
            script: |
              cd ~/app && ls -t *.jar 2>/dev/null | tail -n +2 | xargs rm -f 2>/dev/null || true
              if [ -f ~/app/app.log ] && [ $(stat -c%s ~/app/app.log) -gt 52428800 ]; then
                truncate -s 0 ~/app/app.log
              fi
              sudo systemctl restart pids-backend